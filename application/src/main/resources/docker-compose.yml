services:
  postgres:
    image: postgres:17
    container_name: swatch-postgres

    environment:
      POSTGRES_DB: thingsboard
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5433:5432"

    volumes:
      - swatch-postgres-data:/var/lib/postgresql/data

    restart: unless-stopped

volumes:
  swatch-postgres-data:
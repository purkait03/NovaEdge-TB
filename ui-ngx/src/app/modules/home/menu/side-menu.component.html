<nav class="tb-side-menu ne-side-menu flex flex-col items-stretch justify-start"
     [class.tb-collapsed]="collapsed" [class.ne-collapsed]="collapsed">
  @for (card of navCards$ | async; track card.id) {
    @if (card.toggle) {
      <section class="ne-nav-card ne-toggle-card">
        <tb-menu-toggle [section]="card.toggle" [collapsed]="collapsed"></tb-menu-toggle>
      </section>
    } @else {
      <section class="ne-nav-card ne-links-card" [class.ne-open]="isCardOpen(card)">
        @if (!collapsed) {
          <button type="button" class="ne-card-header"
                  (click)="toggleLocalCard(card, $event)"
                  [attr.aria-expanded]="isCardOpen(card)">
            <span class="ne-card-title">{{ card.titleKey | translate }}</span>
            <tb-icon class="ne-card-chevron" [class.ne-open]="isCardOpen(card)">mdi:chevron-down</tb-icon>
          </button>
        }
        <div class="ne-card-items" [class.ne-open]="collapsed || isCardOpen(card)">
          @for (section of card.sections ?? []; track section.id) {
            <tb-menu-link [section]="section" [collapsed]="collapsed"></tb-menu-link>
          }
        </div>
      </section>
    }
  }
</nav>
